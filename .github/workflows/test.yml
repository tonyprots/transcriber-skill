name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: ffmpeg
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -q && sudo apt-get install -yq ffmpeg
          else
            brew install ffmpeg
          fi
      # Те же версии и хеши, что ставит setup.sh: тесты проверяют поставку, а не
      # то, что pip выберет сегодня по диапазонам.
      - name: зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r skills/transcriber/requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check skills tests
      - name: shellcheck
        run: shellcheck install.sh integrations/handy/install.sh skills/transcriber/scripts/setup.sh
      # Медленные тесты на настоящих моделях (-m slow) здесь не идут: гигабайты
      # весов на каждый прогон. Их гоняют перед тегом, см. references/maintenance.md.
      - name: pytest
        run: python -m pytest -q
