[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "transcriber"
version = "0.6.0"
description = "Локальная расшифровка аудио с независимой сверкой двух ASR и диаризацией"
requires-python = ">=3.10"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["skills/transcriber/requirements.txt"] }
optional-dependencies.apple = { file = ["skills/transcriber/requirements-apple.txt"] }
optional-dependencies.dev = { file = ["requirements-dev.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = []
