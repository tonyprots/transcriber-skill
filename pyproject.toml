[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "transcriber"
# Одна точка правды — audio_transcription.__version__; сверяет
# tests/test_docs_consistency.py.
version = "0.8.1"
description = "Локальная расшифровка аудио с независимой сверкой двух ASR и диаризацией"
requires-python = ">=3.10"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["skills/transcriber/requirements.txt"] }
optional-dependencies.apple = { file = ["skills/transcriber/requirements-apple.txt"] }
optional-dependencies.dev = { file = ["requirements-dev.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Сквозной прогон на живых моделях идёт минутами и требует скачанных весов,
# поэтому по умолчанию он выключен: `pytest -m slow` запускает его отдельно.
addopts = "-q -m 'not slow'"
markers = [
  "slow: сквозной прогон на настоящих моделях (нужны веса в кэше и Apple Silicon)",
]

[tool.setuptools]
packages = []
